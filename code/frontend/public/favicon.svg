<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Glow / Background Accent Tile -->
  <rect width="48" height="48" rx="12" fill="#111827"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Autonomous Agent Neural Node Sub-structure -->
  <circle cx="16" cy="31" r="2.5" fill="#E05D38" fill-opacity="0.85"/>
  <circle cx="24" cy="35" r="2.75" fill="#FBF6EE"/>
  <circle cx="32" cy="30" r="2.2" fill="#E05D38" fill-opacity="0.85"/>
  <circle cx="21" cy="24" r="2" fill="#9CA3AF"/>

  <!-- Network Interconnect Edges -->
  <line x1="16" y1="31" x2="24" y2="35" stroke="rgba(251,246,238,0.4)" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="24" y1="35" x2="32" y2="30" stroke="rgba(251,246,238,0.4)" stroke-width="1.5"/>
  <line x1="16" y1="31" x2="21" y2="24" stroke="rgba(251,246,238,0.3)" stroke-width="1.2"/>
  <line x1="21" y1="24" x2="24" y2="35" stroke="rgba(251,246,238,0.3)" stroke-width="1.2"/>

  <!-- The Verification Chevron / Dynamic Peak (Terracotta Gradient) -->
  <defs>
    <linearGradient id="chevronGrad" x1="12" y1="12" x2="36" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A54"/>
      <stop offset="100%" stop-color="#E05D38"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="22" y1="28" x2="36" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E05D38"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>
  </defs>

  <!-- Left Ascent of G/Delta -->
  <path d="M 12 28 L 22 13 L 26 19 L 20 28 Z" fill="url(#chevronGrad)"/>

  <!-- Verified Invariant Checkmark Sweep passing through the apex -->
  <path d="M 20 25 L 26 31 L 37 13 L 34 11 L 25 25 L 21 21 Z" fill="url(#checkGrad)"/>

  <!-- Precision Star / Spark Accent (Top Right) -->
  <path d="M 34 8 Q 34 11 37 11 Q 34 11 34 14 Q 34 11 31 11 Q 34 11 34 8 Z" fill="#FF7A54"/>
</svg>